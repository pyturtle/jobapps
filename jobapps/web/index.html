<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JobApps">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
<title>JobApps</title>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><img src="/icon.svg" alt="" width="26" height="26"><span>JobApps</span></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="postings">Postings</button>
      <button role="tab" data-tab="history">History</button>
      <button role="tab" data-tab="setup">Setup</button>
    </nav>
    <div class="runpill" id="runpill" hidden></div>
  </div>
</header>
<main>
  <section id="tab-today" class="tab"></section>
  <section id="tab-setup" class="tab" hidden></section>
  <section id="tab-postings" class="tab" hidden></section>
  <section id="tab-history" class="tab" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
