[project]
name = "jobapps"
version = "0.2.0"
description = "Daily batch of fresh job postings, autofilled with your values, with drafted answers."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "playwright>=1.50",
    "pyyaml>=6",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobapps = "jobapps.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobapps"]

[tool.setuptools.package-data]
jobapps = ["*.js", "web/*", "extension/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
